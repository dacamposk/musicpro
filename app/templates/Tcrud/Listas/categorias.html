{% extends 'Tcrud/crud.html' %}
{% load static %}
{% block contenido %}


<div class="container">
  <h1>Listado de categorias</h1>
  

  <a href="{%  url 'agreCategoria' %}" type="button" class="btn btn-primary ">Añadir Categorias</a>
  <br>
  <br>

  <div class="row">
    <table class="table">
      <thead>
        <tr>
          <th scope="col">Nombre Categoria</th>
          <th scope="col">Opciones</th>
        </tr>
      </thead>
      <tbody>
        {% for ve in categorias %}
        <tr>
          <td>{{ve.nombreCategoria}}</td>
          <td><a href="{% url 'delete_Categoria' ve.SKU %}">Eliminar</a></td>


        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>



{% endblock %}
