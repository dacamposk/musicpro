{% extends 'Tcrud/crud.html' %}
{% load static %}
{% block contenido %}


<script>
  function eliminarCategoria(nombreCategoria) {
      Swal.fire({
          title: "¿Estás seguro?",
          text: "Esta acción no se puede deshacer",
          icon: "question",
          showCancelButton: true,
          cancelButtonText: "No, Cancelar",
          confirmButtonText: "Sí, Eliminar",
          reverseButtons: true,
          confirmButtonColor: "#dc3545"
      }).then(function(result) {
          if (result.isConfirmed) {
            window.location.href = "/crud/categoria/eliminar/" + nombreCategoria + "/";
  
          }
      });
  }
</script>


<div class="container">
  <h1>Listado de categorias</h1>
  

  <a href="{%  url 'agreCategoria' %}" type="button" class="btn btn-primary ">Añadir Categorias</a>
  <br>
  <br>

  <div class="row">
    <table class="table">
      <thead>
        <tr>
          <th scope="col">Nombre Categoria</th>
          <th scope="col">Opciones</th>
        </tr>
      </thead>
      <tbody>
        {% for ve in categorias %}
        <tr>
          <td>{{ve.nombreCategoria}}</td>
          <td><a href="#" onclick="eliminarCategoria('{{ ve.nombreCategoria }}')" class="btn btn-danger btn-sm">Eliminar</a></td>

        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>



{% endblock %}
