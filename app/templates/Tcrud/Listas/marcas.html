{% extends 'Tcrud/crud.html' %}
{% load static %}
{% block contenido %}



<script>
  function eliminarMarca(nombreMarca) {
      Swal.fire({
          title: "¿Estás seguro?",
          text: "Esta acción no se puede deshacer",
          icon: "question",
          showCancelButton: true,
          cancelButtonText: "No, Cancelar",
          confirmButtonText: "Sí, Eliminar",
          reverseButtons: true,
          confirmButtonColor: "#dc3545"
      }).then(function(result) {
          if (result.isConfirmed) {
            window.location.href = "/crud/marca/eliminar/" + nombreMarca + "/";


          }
      });
  }
</script>

<!-- table marca-->
<div class="container">
  <h1>Listado de marcas</h1>

  <a href="{%  url 'agreMarca' %}" type="button" class="btn btn-primary ">Añadir Marca</a>
  <br>
  <br>

  <div class="row">
    <table class="table">
      <thead>
        <tr>
          <th scope="col">Nombre Marca</th>
          <th scope="col">Opciones</th>
        </tr>
      </thead>
      <tbody>
        {% for ve in marcas %}
        <tr>
          <td>{{ve.nombreMarca}}</td>

          <td><a href="#" onclick="eliminarMarca('{{ ve.nombreMarca }}')" class="btn btn-danger btn-sm">Eliminar</a></td>
      


        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>


{% endblock %}
