{% extends 'Tcrud/crud.html' %}
{% load static %}
{% block contenido %}

    <!-- table tipo instrumento-->
    <div class="container">
        <h1>Listado de tipos de instrumento</h1>
        <li>
          <a href="{%  url 'agreTipoIns' %}"> Nueva tipo de instrumento</a>
        </li>
        <div class="row">
            <table class="table">
              <thead>
                <tr>
                  <th scope="col">Nombre tipo instrumento</th>
                  <th scope="col">Opciones</th>
                </tr>
              </thead>
                <tbody>
                  {% for ve in tipoi %}
                  <tr>
                    <td>{{ve.nombreTipoInstrumento}}</td>
  
                  </tr>
                  {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

  
    {% endblock %}
