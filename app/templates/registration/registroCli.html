{% extends 'app/base.html' %}
{% load static %}
{% load crispy_forms_tags %}
{% block contenido %}

<section class="container auth-wrap">
    <div class="auth-card">
        <div class="eyebrow">Nueva cuenta</div>
        <h1>Regístrate</h1>
        <p class="sub">Crea tu cuenta para comprar, seguir tus pedidos y guardar tus direcciones de envío.</p>

        <form action="" method="post" id="formulario">
            {% csrf_token %}
            <div class="form-group">
                {{ form|crispy }}
            </div>

            <div class="actions">
                <input type="submit" value="Crear cuenta" class="btn btn-primary" id="enviar" style="flex:1;">
            </div>

            <div class="foot-link">
                ¿Ya tienes cuenta? <a href="{% url 'loginCli' %}">Inicia sesión</a>
            </div>
        </form>
    </div>
</section>

{% endblock %}
