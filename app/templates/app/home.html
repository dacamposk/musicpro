{% extends 'app/base.html' %}
{% load static %}
{% block contenido %}

<div class="contenido">
    <div class="slider">
        <div>
            <img src="img/banner/banner1.jpg" alt="">
        </div>
        <div>
            <img src="img/banner/banner2.png" alt="">
        </div>
        <div>
            <img src="img/banner/banner2.png" alt="">
        </div>
    </div>
</div>

<div class="row">
    {% for p in productos %}
    <div class="col-xs col-sm-6 col-md col-lg-3">
        <div class="producto">
            <div class="card">
                <div class="body-card" >
                    <div class="text-center"><img src="{{ p.imagen.url}}" class="img-fluid" >
                    </div>

                    <h6 class="text-center ">Marca</h6>
                    <h4 class="text-center text-truncate">{{p.nombre}}</h4>
                    <h5 class="text-center ">${{p.precio}}</h5>
                    <!-- Boton Ver Producto -->
                    <div class="text-center"><button type="button" class="btn btn-success " data-bs-toggle="modal"
                            data-bs-target="#{{ p.idProducto}}">
                            Ver Producto</button></div>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}

</div>

{% endblock %}
