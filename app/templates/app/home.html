{% extends 'app/base.html' %}
{% load static %}
{% block contenido %}

<div class="contenido">
    <div class="slider">
        <div>
            <img src="img/banner/banner1.jpg" alt="">
        </div>
        <div>
            <img src="img/banner/banner2.png" alt="">
        </div>
        <div>
            <img src="img/banner/banner2.png" alt="">
        </div>
    </div>
</div>

{% load humanize %}
<div class="row">
    {% for p in productos %}
    <div class="col-xs col-sm-6 col-md col-lg-3">
        <div class="producto">
            <div class="card">
                <div class="body-card" >
                    <div class="text-center"><img src="{{ p.imagen.url}}" class="img-fluid" >
                    </div>

                    <h6 class="text-center ">{{p.marca}}</h6>
                    <h4 class="text-center text-truncate">{{p.nombreProducto}}</h4>
                    <h5 class="text-center ">${{p.precio | intcomma }}</h5>
                    <!-- Boton Ver Producto -->
                    <a href="{% url 'detalle' p.SKU %}"><div class="text-center"> <button  type="button"  class="btn btn-success " >
                        Ver Producto</button> </a></div>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}

</div>

{% endblock %}
