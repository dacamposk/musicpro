{% extends 'app/base.html' %}
{% load static %}
{% block contenido %}

<div class="contenido">

  {% load crispy_forms_tags %}

  <div class="container">
    <div class="d-flex justify-content-center">
      <div class="card" style="width: 30rem;">
        <h3 style="text-align:center; margin-top:10px;">Ingresa Tus Credenciales</h3>
        <div class="card-body">
          <form action="" method="post" id="formulario">
            {% csrf_token %}
            <div class="form-group">
              {{ form|crispy }}
            </div>
            <br>
            <input type="submit" value="Iniciar Sesión" class="btn btn-success" id="enviar">
            <input type="reset" value="Limpiar" class="btn btn-primary" id="limpiar">
            <br>
            <a href="{%url 'RegistroCli'%}">¿No tienes cuenta?</a>
            <br>
            <br>
            <br>
          </form>
        </div>
      </div>
    </div>
  </div>

</div>


<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/bxslider/4.2.12/jquery.bxslider.min.js"></script>

<script>
  $(document).ready(function () {
    $(".slider").bxSlider();
  });
</script>


{% endblock %}
