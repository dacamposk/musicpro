{% extends 'app/base.html' %}
{% load static %}
{% load crispy_forms_tags %}
{% block contenido %}

<section class="container auth-wrap">
    <div class="auth-card">
        <div class="eyebrow">Vuelve al estudio</div>
        <h1>Iniciar sesión</h1>
        <p class="sub">Ingresa tus credenciales para acceder a tu cuenta y ver tus pedidos.</p>

        <form action="" method="post" id="formulario">
            {% csrf_token %}
            <div class="form-group">
                {{ form|crispy }}
            </div>

            <div class="actions">
                <input type="submit" value="Iniciar sesión" class="btn btn-primary" id="enviar" style="flex:1;">
                <input type="reset" value="Limpiar" class="btn btn-ghost" id="limpiar">
            </div>

            <div class="foot-link">
                ¿Sin cuenta todavía? <a href="{% url 'RegistroCli' %}">Crear una nueva</a>
            </div>
        </form>
    </div>
</section>

{% endblock %}
