{% extends 'app/base.html' %}
{% load static %}
{% load crispy_forms_tags %}
{% block contenido %}

<section class="section-content container">
    <header class="section-head" style="padding-top: 0;">
        <h2>Modificar dirección</h2>
        <a href="{% url 'viewUbis' %}" class="meta" style="color: var(--muted);">← Volver</a>
    </header>

    <div class="store-layout">
        {% include 'app/tienda/Perfil/_sidebar.html' with active='ubis' %}

        <main>
            <div class="cart-card" style="padding: 32px; max-width: 560px;">
                <div class="eyebrow" style="margin-bottom: 20px;">Editar los datos</div>
                <form action="" method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div style="display: flex; gap: 10px; margin-top: 20px;">
                        <button type="submit" class="btn btn-primary" style="flex: 1;">Guardar cambios</button>
                        <a href="{% url 'viewUbis' %}" class="btn btn-ghost">Cancelar</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</section>

{% endblock %}
