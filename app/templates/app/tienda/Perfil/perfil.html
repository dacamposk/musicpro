<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Pro</title>
    <!-- Slider  -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/bxslider/4.2.12/jquery.bxslider.css">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">



    {% load static %}

    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
    <script src="{% static 'js/carrito.js' %}"></script>
    <script src="{% static 'js/slider.js' %}"></script>
    <script src="https://www.paypal.com/sdk/js?client-id=test&currency=USD"></script>


</head>
<body>
    

<header>
    <div class="contenedor-anuncio">
        ¡Hemos actualizado nuestras ofertas!
    </div>

    <div class="sesion mt-60">
        {% if user.is_authenticated %}
        <li>
            Bienvenido/a: <a href="#">{{user.email}}</a>
            &nbsp;
            <a href="{% url 'logout' %}">Cerrar Sesion </a>
            &nbsp;
            <a href="{% url 'viewPerfil' %}">Mi perfil </a>
        </li>

        {% else %}
        <li>
            <a href="{% url 'loginCli' %}">Iniciar sesion </a>
        </li>
        {% endif %}

        <div id="cart" class="cart-icon">
            <a href="{% url 'cart' %}"><img src="{% static 'img/icons/carrito.png' %}" alt="Carrito" oncontextmenu="return false;"></a>
            <div id="cart-quantity">{{ cart_count }}</div>
        </div>

    </div>

    <div class="contenedor-logo">
        <a href="{%url 'home' %}">
            <img href class="logo" src="{% static 'img/logo.png' %}" alt="logo"></a>
    </div>


<a href="{% url 'viewOrders' %}"> mis encargos</a>
<a href="{% url 'viewUbis' %}"> mis ubicaciones</a>


<div>
    {% block contenido %}
    {% endblock %}
</div>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/bxslider/4.2.12/jquery.bxslider.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
