{% extends 'app/base.html' %}
{% load static %}
{% block contenido %}

<section class="section-conten padding-y bg">

    <div class="container">
        <div class="row">
            <aside class="col-md-3">
                <!--   SIDEBAR   -->
                <ul class="list-group">
                    <a class="list-group-item" href="{% url 'viewOrders' %}"> Mi historial de ordenes
                    </a>
                    <a class="list-group-item active" style="background: #810404;" href="{% url 'viewUbis' %}">Mis
                        Dirreciones</a>
               
                    <a class="list-group-item" href="#">Configuración de Cuenta</a>

                </ul>
                <br>
                
                <!--   SIDEBAR .//END   -->
            </aside>
            <main class="col-md-9">
                <article class="card">
                    <header class="card-header">
                        <strong class="d-inline-block mr-3">Mis Direcciones de Despacho </strong>

                    </header>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-8">
                                <a href="{% url 'newUbi' %}" class="btn btn-light">Añadir Nueva Dirreción</a>

                            </div>

                        </div> <!-- row.// -->
                    </div> <!-- card-body .// -->
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Dirección</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for i in ubicaciones %}
                                <tr>
                                    <td>
                                        <div class="row">
                                            <label for="ci">Ciudad: {{ i.ubicacion }}</label><br>
                                            <label for="ci">Comuna: {{ i.comuna }}</label><br>
                                            <label for="ci">Número: {{ i.numero }}</label><br>
                                            <a href="{% url 'deleteUbi' i.ubicacion %}"> eliminar</a>
                                        </div>
                                    </td>
                                    <td>

                                        <a href="{% url 'modUbi' i.ubicacion %}" class="btn btn-light">Modificar</a>
                                    </td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
        </div>
        </article>
        </main>
    </div>
    </div>


</section>


{% endblock %}
