{% extends 'app/base.html' %}
{% load static %}
{% block contenido %}


{% load humanize %}
{% for p in producto %}
<div class="card">
  <div class="row no-gutters">
    <aside class="col-md-6">
      <article class="detalle_producto">
        <div >
          <img src="{{ p.imagen.url}}" class="img-fluid">
        </div> <!-- img-big-wrap.// -->

      </article> <!-- gallery-wrap .end// -->
    </aside>
    <main class="col-md-6 border-left" >
      <article class="detalle_producto">
        <h2 class="title">{{p.nombreProducto}}</h2>
        <div class="mb-3">
        <var class="price h4">${{p.precio | intcomma}}</var>


        </div>
        <div style="display: inline-block;" ><h5 style="display: inline; margin: 0;"></h5tyle>Marca:</h5> {{p.marca}}</div>
        <br>
        <br>
        <div><h2>Descripción del Producto</h2></div>
        <hr>
        <div>{{p.descripcion}}</div>
        
        <br>
        <div style="display: inline-block;" ><h5 style="display: inline; margin: 0; color:red;"></h5tyle>Stock:  {{p.stock}} </h5></div>
        <br>
        <br>
        <div><button class="btn btn-primary btn-lg" type="button">Añadir al carrito</button></div>

      </article>

    
       
     
  </div>

  {% endfor %}




{% endblock %}
